method: searched
source: https://developer-docs.paga.com/docs/error-codes and https://developer-docs.paga.com/docs/paga-collect-api-status-code
description: >-
  Paga response-code registry. Paga does not use RFC 9457 problem+json; every
  operation returns a JSON body carrying an integer responseCode (Business API)
  or statusCode (Collect API) plus a human message. responseCode 0 means
  success; negative and positive non-zero codes indicate specific failures.
  This is the non-payments-scheme error registry (see conventions/ for the
  envelope shape). Card-level decline reasons are exposed only through the
  hosted checkout / test cards, not as a documented decline-code table.
format: paga-response-code
envelope:
  business:
    field: responseCode
    success_value: 0
    message_field: message
  collect:
    field: statusCode
    success_value: 0
    message_field: message
