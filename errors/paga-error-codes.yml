collect_status_codes:
- {code: 0, name: SUCCESS, meaning: The request was processed successfully}
- {code: 1, name: IN_PROCESS, meaning: Received and queued; a webhook callback is sent once processed, or query status}
- {code: 2, name: PARTIAL_PAYMENT, meaning: Callback indicates a partial payment was received (if permitted by initiator)}
- {code: -1, name: SYSTEM_ERROR, meaning: Error processing the current request}
- {code: -2, name: REQUEST_EXPIRED, meaning: The payment request has expired}
- {code: -3, name: REQUEST_CANCELLED, meaning: The payment request has been cancelled}
- {code: 114, name: FAILED, meaning: Request failed}
- {code: 115, name: FAILED, meaning: Non-refundable fulfilled payment request}
- {code: 121, name: NOT_FOUND, meaning: Payment request reference number not found}
payment_request_states:
- {state: PENDING, meaning: Received and awaiting authorization/fulfilment from the payer}
- {state: CHARGEABLE, meaning: Payment received; request can now be consumed}
- {state: CONSUMED, meaning: Payment request charge completed}
- {state: EXPIRED, meaning: Payment request has expired}
- {state: FAILED, meaning: Payment request creation failed}
- {state: CANCELLED, meaning: Payment request was cancelled}
