description: >-
  FinOps view of Paga API spend. Paga bills per-transaction fees rather than
  subscriptions: collections, disbursements, bank deposits, airtime/data, bill
  payments, and direct-debit charges each carry a negotiated flat-Naira or
  percentage fee. Cost is driven by transaction volume, channel mix (bank
  transfer / USSD / card / wallet), and merchant agreement. All charges settle
  in NGN.
notes: >-
  Per-transaction rates are negotiated at onboarding and not published as a
  fixed table; reconcile actual fees from settlement statements. Currency NGN.
sources:
- https://developer-docs.paga.com/
- https://www.paga.com/
