meters:
- name: collection_transactions
  description: Payment requests and persistent-account deposits collected, billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - channel
  - api
- name: disbursement_transactions
  description: Money transfers and deposit-to-bank operations, billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - destinationBank
- name: airtime_data_transactions
  description: Airtime and data purchases, commissioned or nominally priced.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - mobileOperator
- name: bill_merchant_payments
  description: Merchant and bill payments, billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - merchant
- name: direct_debit_charges
  description: Tokenized-mandate debits, billed per charge.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - accountReference
principles:
- name: Visibility
  description: Reconcile fees from Paga settlement statements and the transactionHistory / history endpoints.
- name: Allocation
  description: Tag each transaction with a workload-specific referenceNumber to map spend to teams and use cases.
- name: Optimization
  description: Steer collections toward lower-fee channels (bank transfer / USSD) where possible and batch disbursements.
- name: Accountability
  description: Review per-channel transaction fees monthly against negotiated rates.
maintainers:
